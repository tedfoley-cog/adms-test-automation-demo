[project]
name = "ace-service"
version = "1.0.0"
description = "Reporting ACE and regulation allocation service (port of the legacy RTGENACE task)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["ace_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "characterization: pins the behaviour of a legacy task before it is ported",
]

[tool.coverage.run]
source = ["ace_service"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
