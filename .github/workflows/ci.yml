name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[dev]'
      - run: ruff check backend tools
      - run: pytest
        working-directory: backend

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: make test sim
        working-directory: firmware
      - run: ./build/pmu_compliance --suite magnitude && ./build/pmu_compliance --suite phase
        working-directory: firmware
      - run: make replay
        working-directory: legacy/habitat

  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          wget -q https://github.com/renode/renode/releases/download/v1.15.3/renode-1.15.3.linux-portable-dotnet.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode-1.15.3.linux-portable-dotnet.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
      - name: Emulated STM32F407 timing budgets and fault scenarios
        run: python3 tools/build_realtime_report.py --label ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-report
          path: console/public/realtime.json

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm --prefix console install
      - run: npm --prefix console run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
