name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './backend[dev]' -e './services/ace-service'
      - run: ruff check backend tools
      - run: pytest
        working-directory: backend

  ace-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: pip install -e './services/ace-service[dev]'
      - run: ruff check . && ruff format --check .
        working-directory: services/ace-service
      - name: Characterization, parity (savecase + 500 seeded) and service tests
        run: pytest --cov=ace_service --cov-branch --cov-report=term-missing
        working-directory: services/ace-service
      - run: docker build -t ace-service:ci services/ace-service

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: make test
        working-directory: firmware
      - run: make replay
        working-directory: legacy/habitat

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm --prefix console install
      - run: npm --prefix console run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
